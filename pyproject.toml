[project]
name = "simple_rcs"
dynamic = ["version"]
description = "Dependency-free reverse-delta version control for single files, with an RCS-inspired plain-text format, a hash chain, and optional GPG signatures"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
keywords = ["rcs", "version-control", "delta", "diff", "bsdiff", "revision", "history"]

authors = [
    {name = "Won-Kyu Park",email = "wkpark@gmail.com"},
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control",
    "Topic :: System :: Archiving",
]

[project.urls]
Homepage = "https://github.com/wkpark/SimpleRCS"
Documentation = "https://github.com/wkpark/SimpleRCS/wiki"
Issues = "https://github.com/wkpark/SimpleRCS/issues"

[dependency-groups]
dev = [
    "ruff>=0.11.8",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "Cython>=3.0",     # the build backend needs it too; here so `uv sync` compiles in place
]

[tool.ruff]
line-length = 120
target-version = "py310"  # matches requires-python; keeps pyupgrade from emitting 3.11+ syntax

exclude = [
    ".git",
    ".ruff_cache",
    "__pycache__",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle error
    "F",   # pyflakes
    "B",   # flake8-bugbear
    "I",   # isort
    "W",   # pycodestyle warnings
    "C90", # mccabe linter
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "ANN", # flake8-annotations
    "S",   # flake8-bandit
    "A",   # flake8-builtins
    "COM", # flake8-commas
    "T20"  # flake8-print
]

ignore = [
    "ANN",   # type annotations — internal algorithm code
    "N806",  # uppercase variable in function — intentional constants (CHUNK, WINDOW, etc.)
    "S603",  # subprocess call — unavoidable in GPG wrapper
    "C901",  # mccabe complexity — inherent in diff algorithm implementations
    "COM812", # trailing comma — conflicts with ruff formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",  # assert — required in pytest
    "T201",  # print — intentional in benchmarks and compat tests
]

[build-system]
requires = ["setuptools>=77", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

# The Cython matchers are built when a C toolchain is present and skipped
# otherwise -- setup.py downgrades a failed compile to a warning, and
# simple_rcs/matchers.py falls back to StreamSequenceMatcher at import time.
# Extensions must stay optional: they are a speedup, never a requirement.
[tool.setuptools.dynamic]
version = {attr = "simple_rcs.__version__"}

[tool.setuptools.packages.find]
include = ["simple_rcs*"]

[tool.setuptools.package-data]
simple_rcs = ["*.pyx"]
